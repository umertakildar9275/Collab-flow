<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — CollabFlow</title><link rel="stylesheet" href="./css/style.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="./index.html">Collab<span>Flow</span><i>.</i></a><main class="auth-shell"><div class="auth-card panel"><a class="back-link" href="./index.html">← Back to home</a><div class="eyebrow">WELCOME BACK</div><h1>Log in to CollabFlow.</h1><p class="muted">Continue building meaningful connections.</p>
<form id="login-form" class="form-stack"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password"></label><button class="btn full" type="submit">Log in ↗</button></form>
<button id="google-login" class="btn btn-ghost full" type="button">Continue with Google</button><button id="forgot-password" class="link-button" type="button">Forgot password?</button><p class="auth-switch">New to CollabFlow? <a href="./signup.html">Create an account</a></p><p id="auth-message" class="form-message" aria-live="polite"></p></div></main><div id="toast" class="toast"></div><script type="module" src="./js/auth.js"></script></body></html>
