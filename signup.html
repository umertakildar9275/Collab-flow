<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — CollabFlow</title><link rel="stylesheet" href="./css/style.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="./index.html">Collab<span>Flow</span><i>.</i></a><main class="auth-shell"><div class="auth-card panel"><a class="back-link" href="./index.html">← Back to home</a><div class="eyebrow">JOIN THE NETWORK</div><h1>Create your account.</h1><p class="muted">Choose how you want to use CollabFlow.</p>
<form id="signup-form" class="form-stack"><label>Your name<input id="name" type="text" required minlength="2" maxlength="80" autocomplete="name" placeholder="Full name"></label><label>Account type<select id="role" required><option value="creator">Creator</option><option value="brand">Brand</option></select></label><label>Email address<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn full" type="submit">Create account ↗</button></form>
<button id="google-signup" class="btn btn-ghost full" type="button">Continue with Google</button><p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p><p id="auth-message" class="form-message" aria-live="polite"></p></div></main><div id="toast" class="toast"></div><script type="module" src="./js/auth.js"></script></body></html>
